[package]
name = "sat-practice"
version = "0.1.0"
description = "Independent SAT practice desktop application"
authors = ["atl4sss"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sat_practice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
