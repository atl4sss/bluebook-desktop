<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Download your practice app</title><script src="/download.js" defer></script></head>
<body>
<main>
<h1>Download your practice app</h1>
<p>This link permits one download. Start when your connection is stable.</p>
<p>If the transfer fails, ask the person who sent you this link for a replacement.</p>
<form method="post" action="/download">
<input type="hidden" name="token" id="token">
<button id="download" type="submit" disabled>Download</button>
</form>
<p id="status" role="status">Open your personal download link to continue.</p>
<noscript>Enable JavaScript to use your personal download link.</noscript>
</main>
</body>
</html>
