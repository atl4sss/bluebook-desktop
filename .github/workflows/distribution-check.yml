name: Distribution checks
on:
  push:
    paths:
      - 'functions/**'
      - '.github/workflows/distribution-check.yml'
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/distribution-check.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: node --check distribution/server.js && node --check distribution/admin.js
        working-directory: functions
