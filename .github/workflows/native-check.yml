name: Native checks
on:
  push:
    branches: [main]
    paths: ["src-tauri/**", ".github/workflows/native-check.yml"]
  pull_request:
    paths: ["src-tauri/**", ".github/workflows/native-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Windows shortcut event sequences
        shell: bash
        run: |
          rustc --edition 2021 --test src-tauri/src/windows_shortcut_filter.rs -o shortcut-filter-tests
          ./shortcut-filter-tests
      - run: npm ci
      - run: npm run build
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
